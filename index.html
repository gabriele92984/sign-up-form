<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" href="./assets/fonts/norse/Norse-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <title>Sign-up Form</title>
</head>

<body>
  <div class="main-wrapper">

    <div class="left-wrapper">
      <div class="left-upper-wrapper">
        <div class="odin-wrapper">
          <img class="odin-lined" src="./assets/images/odin-lined.png" alt="The Odin Project Logo">
          <h1 class="odin-text">ODIN</h1>
        </div>
      </div>
      <div class="left-bottom-wrapper">
        <div class="img-credit-creator">
          <p>Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></p>
        </div>
      </div>
    </div>

    <div class="right-wrapper">
      <div class="form-intro">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
        <p>Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em> you want to.</p>
      </div>

      <div class="form-wrapper">
        <h3>Let's do this!</h3>
        <form action="#" method="get">
          <div class="fields-wrapper">
            <div class="left-field">
              <div class="input-field">
                <label for="first_name">FIRST NAME</label>
                <input type="text" name="first_name" id="first_name" minlength="2" required>
              </div>
              <div class="input-field">
                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" minlength="3" maxlength="64" required>
              </div>
              <div class="input-field">
                <label for="password">PASSWORD</label>
                <input type="password" name="password" id="password" minlength="8" maxlength="32" required>
              </div>
            </div>
            <div class="right-field">
              <div class="input-field">
                <label for="last_name">LAST NAME</label>
                <input type="text" name="last_name" id="last_name" minlength="2" maxlength="32" required>
              </div>
              <div class="input-field">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="0123-456-937-8901" required>
              </div>
              <div class="input-field">
                <label for="password_confirm">CONFIRM PASSWORD</label>
                <input type="password" name="password_confirm" id="password_confirm" required>
              </div>  
            </div>
          </div>
            <div class="btn-div">
              <button class="create-account" type="submit">Create Account</button>
            </div>
        </form>
      </div>
      <div class="account-login">
        <p>Already have an account? <span><a href="#">Log in</a></span></p>
      </div>
    </div>

  </div>
</body>
</html>
